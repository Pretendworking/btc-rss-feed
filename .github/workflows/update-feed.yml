name: Update Top 10 Crypto RSS feed


on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: write


concurrency:
  group: btc-rss-update
  cancel-in-progress: false


jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4


      - name: Fetch top 10 prices and write RSS XML
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from email.utils import format_datetime
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from xml.etree.ElementTree import Element, SubElement, tostring


          url = "https://api.coinpaprika.com/v1/tickers?quotes=USD"
          request = Request(url, headers={"Accept": "application/json", "User-Agent": "GitHub-Crypto-RSS/1.0"})
          with urlopen(request, timeout=20) as response:
              tickers = json.loads(response.read().decode("utf-8"))
